name: CPU integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  llama-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check reproduce.py tools upstream/prepare.py campaign.py
      - run: uv run pytest -q
  dspark-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dspark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - run: uv sync --locked
      - run: uv run ruff format --check deepspec tests scripts
      - run: uv run ruff check deepspec tests scripts
      - run: uv run ty check deepspec/megakernel
      - run: uv run python -m pytest -q
