[project]
name = "dspark-megakernel"
version = "0.1.0"
description = "GB300 DSpark proposal: megakernel vs CUDA Graphs + PDL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.9",
  "nvidia-cutlass==4.2.0.0; sys_platform == 'linux'",
  "numpy==2.4.4",
  "prettytable==3.17.0",
  "pyyaml==6.0.3",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "tensorboard==2.20.0",
  "torch==2.9.1",
  "tqdm==4.67.3",
  "transformers==5.10.2",
  "typing-extensions==4.15.0",
]

[dependency-groups]
dev = [
  "modal==1.2.4",
  "pytest==8.4.2",
  "ruff==0.14.14",
  "ty==0.0.14",
]

[tool.uv]
exclude-newer = "1 week"
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
